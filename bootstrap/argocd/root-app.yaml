# The app-of-apps entrypoint. This is the only Application applied by hand
# (by scripts/up.sh); every other workload on the cluster is a child of it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mpavlovicbb/platform-reference
    targetRevision: main
    path: platform/root
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# The app-of-apps entrypoint. This is the only Application applied by hand
# (by scripts/up.sh); every other workload on the cluster is a child of it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mpavlovicbb/platform-reference
    targetRevision: main
    path: platform/root
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ArgoCD appends pre-delete finalizers to child Applications whose charts
  # ship helm pre-delete hooks (kyverno does). Finalizers on Applications are
  # runtime-owned; comparing them to git only manufactures drift.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true

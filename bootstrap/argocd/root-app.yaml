# The app-of-apps entrypoint. This is the only Application applied by hand
# (by scripts/up.sh); every other workload on the cluster is a child of it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mpavlovicbb/platform-reference
    targetRevision: main
    path: platform/root
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ArgoCD appends pre-delete finalizers to child Applications whose charts
  # ship helm pre-delete hooks (kyverno does). Finalizers on Applications are
  # runtime-owned; comparing them to git only manufactures drift.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    # The root is the one Application that must never stop trying: with sync
    # waves gating on child health, slow-converging children (cold image
    # pulls on a small CI runner) can outlast the default 5 attempts, after
    # which the sync stays Failed until a human intervenes. Patient, capped
    # backoff instead.
    retry:
      limit: 30
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m

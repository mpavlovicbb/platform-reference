# Deployed into the policy-enforced demo namespace: pinned tag and resource
# requests are not optional here, they are admission-checked.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: demo
  labels:
    app.kubernetes.io/name: queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue-worker
    spec:
      containers:
        - name: worker
          image: localhost:5001/queue-worker:0.1.0
          ports:
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: queue-worker
  namespace: demo
  labels:
    app.kubernetes.io/name: queue-worker
spec:
  selector:
    app.kubernetes.io/name: queue-worker
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: queue-worker
  namespace: demo
  labels:
    app.kubernetes.io/name: queue-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: queue-worker
  endpoints:
    - port: metrics
      interval: 30s

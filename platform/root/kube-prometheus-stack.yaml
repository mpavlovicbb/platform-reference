apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Prometheus operator CRDs are far past client-side apply limits, and the
    # chart mutates empty fields the server normalizes — same class of phantom
    # drift as kyverno, same fix.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0
    helm:
      valuesObject:
        # Watch ServiceMonitors/PodMonitors/Rules across all namespaces, not
        # only helm-labelled ones — tenants bring their own.
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 24h
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
        grafana:
          # Admin credentials are generated by scripts/up.sh at boot — never
          # committed. Keys: admin-user / admin-password.
          admin:
            existingSecret: grafana-admin
          # Anonymous VIEWER on a localhost-only deployment: lets docs
          # screenshots and drive-by reviewers see dashboards without
          # credentials. Editing still requires the admin login. Remove on
          # any internet-facing deployment (see SECURITY.md).
          "grafana.ini":
            auth.anonymous:
              enabled: true
              org_role: Viewer
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

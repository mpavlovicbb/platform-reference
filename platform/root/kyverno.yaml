apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      valuesObject:
        admissionController:
          replicas: 1
          container:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
        backgroundController:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        cleanupController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        reportsController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # The chart renders a literal `labels: {}` on its policies.kyverno.io CRDs;
  # the API server drops empty maps, which reads as permanent drift. Scoped to
  # CRD labels only — everything else still diffs normally.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The chart renders 'labels: {}' on its CRDs; legacy diffing reads the
    # server-dropped empty map as permanent drift. Server-side diff compares
    # through the same SSA machinery that applies the manifests, so the
    # phantom disappears.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      valuesObject:
        admissionController:
          # Single replica is a laptop trade-off, stated: with the webhook's
          # fail-closed policy, this one pod being down blocks admission in
          # enforced namespaces. Production runs 3 replicas + PDB.
          replicas: 1
          container:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
        backgroundController:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        cleanupController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        reportsController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # The chart renders a literal `labels: {}` on its policies.kyverno.io CRDs;
  # the API server drops empty maps, which reads as permanent drift. Scoped to
  # CRD labels only — everything else still diffs normally.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

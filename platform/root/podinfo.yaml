# First managed application: podinfo, a tiny web service that exposes
# Prometheus metrics. It proves the delivery chain end to end and later
# doubles as an observability test target.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.14.1
    helm:
      valuesObject:
        # Debug level makes podinfo access-log every request — the demo's
        # logs panel needs visible traffic, and this workload exists to emit
        # signal.
        logLevel: debug
        serviceMonitor:
          enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

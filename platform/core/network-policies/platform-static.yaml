# East-west restrictions for the platform's secret path (issue #7). Ingress
# scope deliberately: egress default-deny drags DNS and apiserver allowances
# into every namespace for little local gain — the ADR-worthy line is that
# nothing may TALK TO the secrets backend except its consumers.
---
# Nothing reaches Vault except External Secrets and the in-namespace seed job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-consumers
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [external-secrets, vault]
      ports:
        - port: 8200
          protocol: TCP
---
# External Secrets: nothing reaches it except the API server calling its
# webhook. The apiserver egresses from the node (kind: host network), which
# pod/namespace selectors cannot express — so the webhook port is open by
# port, everything else denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-from-apiserver
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 10250
          protocol: TCP

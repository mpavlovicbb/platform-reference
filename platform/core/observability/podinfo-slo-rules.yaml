# SLO: 99% of podinfo requests succeed, measured over 30 days.
# Alerting is multi-window multi-burn-rate (SRE workbook ch.5): page when the
# error budget burns fast, warn when it burns slow, stay silent otherwise.
# Static threshold alerts were rejected — the ADR on alerting records why.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-slo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform-slo
spec:
  groups:
    - name: podinfo.slo.recording
      interval: 30s
      rules:
        - record: podinfo:http_errors:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo", status=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[5m]))
        - record: podinfo:http_errors:ratio_rate30m
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo", status=~"5.."}[30m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[30m]))
        - record: podinfo:http_errors:ratio_rate1h
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo", status=~"5.."}[1h]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[1h]))
        - record: podinfo:http_errors:ratio_rate6h
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo", status=~"5.."}[6h]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[6h]))
    - name: podinfo.slo.alerts
      rules:
        - alert: PodinfoErrorBudgetFastBurn
          expr: |
            podinfo:http_errors:ratio_rate5m > (14.4 * 0.01)
            and
            podinfo:http_errors:ratio_rate1h > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
            slo: podinfo-availability
          annotations:
            summary: podinfo is burning its monthly error budget 14x too fast
            description: >-
              More than 2% of the 30-day error budget consumed in the last
              hour. At this rate the budget is gone in under two days.
        - alert: PodinfoErrorBudgetSlowBurn
          expr: |
            podinfo:http_errors:ratio_rate30m > (6 * 0.01)
            and
            podinfo:http_errors:ratio_rate6h > (6 * 0.01)
          for: 15m
          labels:
            severity: warning
            slo: podinfo-availability
          annotations:
            summary: podinfo error budget burning steadily
            description: >-
              Sustained elevated error ratio across 30m and 6h windows;
              budget exhaustion in days, not hours. Investigate before it
              pages someone.

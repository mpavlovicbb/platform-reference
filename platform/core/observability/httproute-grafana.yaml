# Grafana through the platform gateway:
#   http://grafana.platform.local:8080 (Host header or /etc/hosts entry)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - grafana.platform.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80

# Golden-signals dashboard for the demo workload, provisioned as code via the
# Grafana sidecar. No hand-clicked dashboards: this file is the source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-podinfo-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  podinfo-golden-signals.json: |
    {
      "uid": "podinfo-golden",
      "title": "podinfo / golden signals",
      "tags": ["platform", "slo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_request_duration_seconds_count{namespace=\"demo\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio vs SLO burn thresholds",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "podinfo:http_errors:ratio_rate5m",
              "legendFormat": "error ratio (5m)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {"thresholdsStyle": {"mode": "line"}},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.06},
                  {"color": "red", "value": 0.144}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Live logs (demo namespace)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"demo\"}"
            }
          ],
          "options": {"showTime": true, "sortOrder": "Descending"}
        }
      ]
    }

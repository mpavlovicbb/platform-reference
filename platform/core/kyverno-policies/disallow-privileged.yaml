# Audit cluster-wide rather than Enforce: platform components legitimately
# differ in their security contexts, and a reference repo should surface the
# signal without manufacturing false positives. Tenant namespaces graduate
# to Enforce via the labelled policies.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system]
      validate:
        message: Privileged containers are not allowed.
        pattern:
          spec:
            =(securityContext):
              =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"

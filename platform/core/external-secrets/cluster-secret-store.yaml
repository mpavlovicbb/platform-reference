# The provider abstraction boundary. Everything above this resource is
# cloud-independent; swapping Vault for AWS Secrets Manager or Azure Key Vault
# means replacing this one spec (see infrastructure/environments/*).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-dev-token
          namespace: external-secrets
          key: token

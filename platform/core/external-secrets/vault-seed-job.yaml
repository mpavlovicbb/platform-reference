# Seeds a demo secret into Vault on each sync, generating the value at runtime.
# Nothing here is a credential: the token arrives from the runtime-generated
# Secret, the demo password from /dev/urandom.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-seed
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: hashicorp/vault:1.20
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-dev-token
                  key: token
          command:
            - /bin/sh
            - -ec
            - |
              until vault status >/dev/null 2>&1; do
                echo "waiting for vault..."; sleep 3
              done
              vault kv put secret/demo/config \
                username=demo \
                password="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
              echo "seeded secret/demo/config"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

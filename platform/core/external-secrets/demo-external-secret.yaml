# Proves the chain end to end: Vault (runtime-seeded) -> ClusterSecretStore ->
# ExternalSecret -> plain Kubernetes Secret consumable by any workload in demo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-config
  namespace: demo
spec:
  # Short interval on purpose: dev-mode Vault is in-memory, so a Vault
  # restart invalidates the seed and this is the recovery clock. Five
  # minutes keeps the demo self-healing; production backends can afford 1h.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: demo-config
  data:
    - secretKey: username
      remoteRef:
        key: demo/config
        property: username
    - secretKey: password
      remoteRef:
        key: demo/config
        property: password

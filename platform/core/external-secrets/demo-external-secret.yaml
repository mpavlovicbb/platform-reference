# Proves the chain end to end: Vault (runtime-seeded) -> ClusterSecretStore ->
# ExternalSecret -> plain Kubernetes Secret consumable by any workload in demo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-config
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: demo-config
  data:
    - secretKey: username
      remoteRef:
        key: demo/config
        property: username
    - secretKey: password
      remoteRef:
        key: demo/config
        property: password

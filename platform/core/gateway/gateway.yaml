# The platform's single north-south entrypoint. The EnvoyProxy config pins the
# data-plane service to the NodePorts that kind maps to localhost:8080/8443;
# on the cloud paths the same Gateway gets a LoadBalancer service instead —
# that difference lives entirely in the EnvoyProxy resource.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                # Only ports with a matching Gateway listener may appear here:
                # an entry without a listener merges into the generated service
                # as a nameless port and fails validation. 443 joins with the
                # https listener.
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: platform
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

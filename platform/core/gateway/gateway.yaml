# The platform's single north-south entrypoint. The EnvoyProxy config pins the
# data-plane service to the NodePorts that kind maps to localhost:8080/8443;
# on the cloud paths the same Gateway gets a LoadBalancer service instead —
# that difference lives entirely in the EnvoyProxy resource.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                # Every entry here must have a matching Gateway listener: an
                # entry without one merges into the generated service as a
                # nameless port and fails validation.
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
---
# cert-manager's gateway-shim watches the annotation and provisions
# platform-tls from the selfsigned issuer — the local trust root finally
# securing something (issue #8).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  gatewayClassName: platform
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Only namespaces the platform has labelled may attach routes; a
          # compromised tenant must not be able to claim grafana's hostname.
          from: Selector
          selector:
            matchLabels:
              platform.mpavlovicbb.dev/gateway-access: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.platform.local"
      tls:
        mode: Terminate
        certificateRefs:
          - name: platform-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.mpavlovicbb.dev/gateway-access: "true"

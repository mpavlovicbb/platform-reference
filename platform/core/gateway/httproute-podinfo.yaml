# First route through the gateway. Reachable locally with:
#   curl -H "Host: podinfo.platform.local" http://localhost:8080/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: demo
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - podinfo.platform.local
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898

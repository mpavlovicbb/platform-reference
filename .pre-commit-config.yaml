# Local hooks call locally installed binaries so hook behaviour matches CI exactly.
# Install: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: yamllint -c .yamllint.yaml
        language: system
        types: [yaml]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: kubeconform
        name: kubeconform (k8s manifest schemas)
        # Tenant files are platform config consumed by the ApplicationSet,
        # not Kubernetes manifests; kind's config uses its own schema.
        entry: kubeconform -strict -ignore-missing-schemas -summary
        language: system
        files: ^(platform|bootstrap|demo)/.*\.ya?ml$
        exclude: ^(platform/tenants/|bootstrap/kind/)

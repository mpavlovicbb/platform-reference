# Local hooks call locally installed binaries so hook behaviour matches CI exactly.
# Install: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^platform/.*$  # kustomize and helm templates are validated by kubeconform instead

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: yamllint -c .yamllint.yaml
        language: system
        types: [yaml]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

# Supply chain on every release: SPDX SBOM of the repository, signed with
# cosign keyless (GitHub OIDC identity), attached to the release. Verifiers:
#   cosign verify-blob --certificate sbom.spdx.json.pem \
#     --signature sbom.spdx.json.sig \
#     --certificate-identity-regexp 'github.com/mpavlovicbb/platform-reference' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     sbom.spdx.json
name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write  # cosign keyless signing via the workflow's OIDC identity

jobs:
  sbom:
    name: sbom and signature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install syft and cosign (pinned)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin syft
          sudo curl -sSLo /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          sudo chmod +x /usr/local/bin/cosign
      - name: Generate SBOM
        run: syft scan dir:. -o spdx-json > sbom.spdx.json
      - name: Sign SBOM (keyless)
        run: |
          cosign sign-blob --yes sbom.spdx.json \
            --output-signature sbom.spdx.json.sig \
            --output-certificate sbom.spdx.json.pem
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.spdx.json sbom.spdx.json.sig sbom.spdx.json.pem --clobber

# Validation: secret scanning, lint, manifest schemas, repo policy, misconfig
# scanning. tflint joins when the Terraform substrate lands (phase 6); the
# full-platform e2e boot lives in e2e.yaml.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install linters (pinned - CI behaviour must not float with PyPI)
        run: |
          pip install --quiet pre-commit==4.6.1 yamllint==1.35.1
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Run pre-commit
        # gitleaks runs as its own job above; shellcheck is preinstalled on ubuntu-latest
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

  policy:
    name: conftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install conftest (pinned)
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin conftest
      - name: Repo invariants
        # The vendored upstream ArgoCD manifest is upstream's code, not ours
        # to police — bootstrap/argocd is listed by file to keep it out.
        run: |
          conftest test --policy policies/ platform/root/ platform/core/ demo/ \
            bootstrap/argocd/root-app.yaml bootstrap/argocd/local-overrides.yaml

  misconfig:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install trivy (pinned)
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin trivy
      - name: Misconfiguration scan
        # The vendored upstream manifest is scanned by its own project.
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-files "bootstrap/argocd/argocd-install.yaml" .

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install terraform and tflint (pinned)
        run: |
          curl -sSLo /tmp/tf.zip https://releases.hashicorp.com/terraform/1.15.6/terraform_1.15.6_linux_amd64.zip
          sudo unzip -oq /tmp/tf.zip -d /usr/local/bin
          curl -sSLo /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          sudo unzip -oq /tmp/tflint.zip -d /usr/local/bin
      - name: Validate and lint every environment
        # Plan-level checks without credentials: validate + tflint. Applying
        # is a human act by design — no cloud credentials exist in CI.
        run: |
          for env in hetzner aws azure; do
            echo "=== $env ==="
            terraform -chdir="infrastructure/environments/$env" init -backend=false -input=false
            terraform -chdir="infrastructure/environments/$env" validate
            tflint --chdir="infrastructure/environments/$env"
          done

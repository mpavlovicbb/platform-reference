# Boots the entire platform from nothing in kind on every PR: the repo's
# central claim, re-proven as a required check. The revision under test is
# pushed as a temporary ref so ArgoCD syncs THIS change, not upstream main.
# Limitation, documented: fork PRs run with a read-only token and cannot
# push the temp ref; same-repo branches (the only current contributors) can.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: boot full platform in kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # temp ref push; forks never receive this
    env:
      E2E_REF: refs/e2e/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install kind (pinned)
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Publish this revision as the e2e ref
        run: ./scripts/ci/e2e-publish-ref.sh

      - name: Boot
        env:
          APP_WAIT_TIMEOUT_SECONDS: "900"  # 4 vCPU runner pulls slower than a laptop
        run: make up

      - name: Smoke - policy rejects a bad manifest
        run: |
          if kubectl --context kind-platform run bad --image=nginx:latest -n demo 2>err.txt; then
            echo "policy did NOT reject nginx:latest" >&2; exit 1
          fi
          grep -q "disallow-latest-tag" err.txt

      - name: Smoke - secrets chain materialized
        run: kubectl --context kind-platform -n demo get secret demo-config

      - name: Smoke - gateway routes
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: podinfo.platform.local' http://localhost:8080/)"
          [ "$code" = "200" ] || { echo "gateway returned $code" >&2; exit 1; }

      - name: Smoke - https with cert-manager certificate
        run: |
          code="$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve podinfo.platform.local:8443:127.0.0.1 https://podinfo.platform.local:8443/)"
          [ "$code" = "200" ] || { echo "https gateway returned $code" >&2; exit 1; }
          kubectl --context kind-platform -n envoy-gateway-system get secret platform-tls >/dev/null

      - name: Smoke - tenant network floor generated
        run: |
          for np in default-deny-ingress allow-same-namespace allow-monitoring-scrape allow-platform-gateway; do
            kubectl --context kind-platform -n demo get networkpolicy "$np" >/dev/null || { echo "missing networkpolicy $np" >&2; exit 1; }
          done

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-platform get applications -n argocd \
            -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status' || true
          kubectl --context kind-platform get application platform-root -n argocd -o jsonpath='{.status.conditions}' || true
          kubectl --context kind-platform logs -n argocd deployment/argocd-repo-server --tail=30 || true
          kubectl --context kind-platform get pods -A --field-selector=status.phase!=Running || true
          kubectl --context kind-platform get events -A --sort-by=.lastTimestamp | tail -30 || true

      - name: Delete e2e ref
        if: always()
        run: git push -q origin ":${E2E_REF}" || true
